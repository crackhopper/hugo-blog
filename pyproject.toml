[project]
name = "hugo-blog-tooling"
version = "0.1.0"
description = "Local tooling for the Hugo + Obsidian blog."
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.15.4",
  "markdown-it-py>=3.0.0",
  "pyyaml>=6.0.1",
  "watchdog>=3.0.0",
]

[dependency-groups]
dev = []

[project.scripts]
blog-init = "hugo_blog.cli.init:main"
blog-serve = "hugo_blog.preview.serve:main"
blog-build = "hugo_blog.cli.build:main"
blog-deploy = "hugo_blog.cli.deploy:main"
blog-normalize = "hugo_blog.pipeline.normalize:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
